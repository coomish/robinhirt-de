<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Instrument Sans';font-weight:400 700;src:url('../public/fonts/instrument-sans-latin-wght-normal.woff2') format('woff2-variations')}
@font-face{font-family:'JetBrains Mono';font-weight:100 800;src:url('../public/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f1f2ef;color:#1a1c1a;font-family:'Instrument Sans',sans-serif}
.name{position:absolute;left:72px;top:64px;font-size:28px;font-weight:600}
.rolle{position:absolute;left:72px;top:104px;font-family:'JetBrains Mono',monospace;font-size:18px;color:#5b615b}
.satz{position:absolute;left:72px;top:170px;width:980px;font-size:58px;line-height:1.1;letter-spacing:-0.018em;font-weight:500}
svg{position:absolute;left:0;top:420px}
.fuss{position:absolute;left:72px;top:586px;font-family:'JetBrains Mono',monospace;font-size:16px;color:#5b615b}
</style></head><body>
<div class="name">Dr.-Ing. Robin Hirt</div>
<div class="rolle">Gründer von prenode · Karlsruhe</div>
<div class="satz">Unternehmer. Seit über zehn Jahren arbeite ich an künstlicher Intelligenz, die im Betrieb funktionieren muss.</div>
<svg width="1200" height="160" viewBox="0 0 1200 160"><path id="band" fill="rgba(26,28,26,0.06)"/><path id="trace" fill="none" stroke="#1a1c1a" stroke-width="2" stroke-linejoin="round"/><g id="marks"></g></svg>
<div class="fuss">Synthetisches Signal · Erkennung lokal im Browser</div>
<script>
let a=2018;const r=()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
const g=()=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(2*Math.PI*r());
const N=600,v=[],win=[],lo=[],hi=[],marks=[];let drift=0,step=0;
for(let i=0;i<N;i++){drift=drift*0.99+g()*0.006;step*=0.99;let sp=0;if(i===300)sp=0.9;if(i===470)step+=0.45;
 const x=0.3*Math.sin(i/90)+drift+step+sp+g()*0.05;v.push(x);
 const n=win.length;let m=0,s=0.05;if(n>=20){m=win.reduce((p,c)=>p+c,0)/n;const q=win.reduce((p,c)=>p+c*c,0)/n-m*m;s=Math.max(Math.sqrt(Math.max(0,q)),0.05)}else if(n){m=win.reduce((p,c)=>p+c,0)/n}
 lo.push(m-3.5*s);hi.push(m+3.5*s);if(n>=20&&Math.abs(x-m)>3.5*s&&(!marks.length||i-marks[marks.length-1]>30))marks.push(i);
 win.push(x);if(win.length>120)win.shift();}
const X=i=>i*2,Y=x=>80-x*55;
document.getElementById('trace').setAttribute('d',v.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x).toFixed(1)).join(' '));
document.getElementById('band').setAttribute('d',hi.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x).toFixed(1)).join(' ')+lo.map((x,i)=>'L'+X(N-1-i)+' '+Y(lo[N-1-i]).toFixed(1)).join(' ')+'Z');
document.getElementById('marks').innerHTML=marks.map(i=>`<circle cx="${X(i)}" cy="${Y(v[i]).toFixed(1)}" r="5" fill="#a3470a"/>`).join('');
</script></body></html>
